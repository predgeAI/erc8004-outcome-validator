# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: predge-monad-indexer
address_format: lowercase
description: >-
  Predge on Monad testnet: ERC-8004 validation requests and verdicts, bonded verdicts and
  slashes, AgentJob escrow lifecycle and pay-per-call settlement receipts.

contracts:
  # Predge's own ERC-8004-shaped validation registry (canonical event shapes).
  - name: PredgeAgentValidator
    handler: src/handlers/validation.ts
    events:
      - event: "ValidationRequest(address indexed validatorAddress, uint256 indexed agentId, string requestURI, bytes32 indexed requestHash)"
      - event: "ValidationResponse(address indexed validatorAddress, uint256 indexed agentId, bytes32 indexed requestHash, uint8 response, string responseURI, bytes32 responseHash, string tag)"
      - event: "ValidatorUpdated(address indexed previousValidator, address indexed newValidator)"

  # ERC-8004 reference ValidationRegistry (shared deployment). Same event shapes as above;
  # the handler filters on Predge's validator address so only Predge verdicts are stored.
  - name: ERC8004ValidationRegistry
    handler: src/handlers/validation.ts
    events:
      - event: "ValidationRequest(address indexed validatorAddress, uint256 indexed agentId, string requestURI, bytes32 indexed requestHash)"
      - event: "ValidationResponse(address indexed validatorAddress, uint256 indexed agentId, bytes32 indexed requestHash, uint8 response, string responseURI, bytes32 responseHash, string tag)"

  # ERC-8004 reference IdentityRegistry (shared deployment), filtered on Predge's owner key.
  - name: ERC8004IdentityRegistry
    handler: src/handlers/identity.ts
    events:
      - event: "Registered(uint256 indexed agentId, string agentURI, address indexed owner)"

  # Bonded verdicts. Two instances: the main bond and the slash-demo instance.
  - name: PredgeValidatorBond
    handler: src/handlers/bond.ts
    events:
      - event: "Committed(bytes32 indexed requestHash, bytes32 expected, uint96 bond, uint64 stakedAt)"
      - event: "Scored(bytes32 indexed requestHash, uint8 score, uint64 scoredAt)"
      - event: "Slashed(bytes32 indexed requestHash, address indexed challenger, uint96 bond, uint8 recordedScore, bytes32 deliveredHash)"
      - event: "Reclaimed(bytes32 indexed requestHash, uint96 bond)"

  # Escrowed agent jobs (create -> submit -> complete | reject).
  - name: AgentJob
    handler: src/handlers/job.ts
    events:
      - event: "JobCreated(uint256 indexed jobId, address indexed client, address indexed evaluator, address provider, uint96 escrow, bytes32 specHash)"
      - event: "Submitted(uint256 indexed jobId, bytes32 deliverable)"
      - event: "Completed(uint256 indexed jobId, bytes32 reason, address provider, uint96 paid)"
      - event: "Rejected(uint256 indexed jobId, bytes32 reason, address client, uint96 refunded)"

  # Pay-per-call settlement (payForRoute).
  - name: PredgeSettlement
    handler: src/handlers/settlement.ts
    events:
      - event: "Paid(address indexed payer, bytes32 indexed route, uint256 amount, uint256 timestamp, string meta)"
      - event: "Withdrawn(address indexed to, uint256 amount)"

chains:
  - id: 10143 # Monad testnet
    # Block 68349040 is the PredgeAgentValidator deploy tx (monad/deployment.json), the
    # earliest Predge contract on Monad testnet. Nothing relevant happens before it.
    start_block: 68349040
    # Monad testnet and mainnet are HyperSync chains; on Envio Cloud HyperSync is built in. Locally
    # set ENVIO_API_TOKEN (see README). The old public-RPC sync steps 100 blocks per call.
    contracts:
      - name: PredgeAgentValidator
        address: "0x884764736dBe1FD36291bDd3Afd50A75465F6e8A"
      - name: ERC8004ValidationRegistry
        address: "0x8004Cb1BF31DAf7788923b405b754f57acEB4272"
      - name: ERC8004IdentityRegistry
        address: "0x8004A818BFB912233c491871b3d84c89A494BD9e"
      - name: PredgeValidatorBond
        address:
          - "0x0fE4D5fF3f4392bEC36c8003079E31102a403E84" # main bond (deploy block 68349070)
          - "0x95652b86c10Eb0E012b22E08dBC98481d4a19Bc2" # slash-demo instance (deploy block 68958546)
      - name: AgentJob
        address: "0x34F1ef2f39Bfdd6c10Fcaa02f5B257A5dB2e93E9"
      - name: PredgeSettlement
        address: "0xf4EE0Af65804D5754E59316b3DBB53D5c3AeeeF9"
  - id: 143 # Monad mainnet (monad/mainnet/deployment.json); PredgeAgentValidator deploy block
    start_block: 112858595
    contracts:
      - name: PredgeAgentValidator
        address: "0xf4EE0Af65804D5754E59316b3DBB53D5c3AeeeF9"
      - name: ERC8004ValidationRegistry
        address: "0x8004Cc8439f36fd5F9F049D9fF86523Df6dAAB58"
      - name: PredgeValidatorBond
        address: "0xd7bC19f836a92561b368eFf34667c32cAe4E7111"
      - name: AgentJob
        address: "0x64668df7917A84a26d53Fff7883DD998258D6987"
      - name: PredgeSettlement
        address: "0xb4540AD38FE0bCd08578664151689d4E9dd67F35"
